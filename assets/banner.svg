<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #cbd5e1;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 13px;
      fill: #a5b4fc;
      letter-spacing: 1.5px;
    }
    .card-title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #f8fafc;
    }
    .card-sub {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 12px;
      fill: #94a3b8;
    }

    /* CSS Animations for Dynamic Dynamic Floating Background Elements */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.08); }
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(1deg); }
    }
    @keyframes floatReverse {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(12px) rotate(-1.5deg); }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes particleFade {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.8; }
    }

    .bg-pulse-1 { animation: pulseGlow 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .bg-pulse-2 { animation: pulseGlow 10s ease-in-out infinite 2s; transform-origin: 1000px 250px; }
    .float-element-1 { animation: floatSlow 6s ease-in-out infinite; }
    .float-element-2 { animation: floatReverse 7s ease-in-out infinite 1s; }
    .animated-line {
      stroke-dasharray: 10 15;
      animation: dashMove 20s linear infinite;
    }
    .p1 { animation: particleFade 3s ease-in-out infinite; }
    .p2 { animation: particleFade 4s ease-in-out infinite 1s; }
    .p3 { animation: particleFade 3.5s ease-in-out infinite 2s; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Outer Border -->
  <rect width="1198" height="338" x="1" y="1" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Dynamic Animated Glow Orbs in Background -->
  <circle class="bg-pulse-1" cx="180" cy="80" r="140" fill="#6366f1" opacity="0.25" filter="url(#glow)"/>
  <circle class="bg-pulse-2" cx="1020" cy="240" r="160" fill="#ec4899" opacity="0.2" filter="url(#glow)"/>
  <circle class="bg-pulse-1" cx="850" cy="60" r="100" fill="#06b6d4" opacity="0.18" filter="url(#glow)"/>

  <!-- Subtle Dynamic Wave Grid/Lines in Background -->
  <path class="animated-line" d="M -50 280 Q 300 320 650 220 T 1250 180" fill="none" stroke="#6366f1" stroke-opacity="0.25" stroke-width="2"/>
  <path class="animated-line" d="M -50 100 Q 400 40 850 160 T 1250 80" fill="none" stroke="#a855f7" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Ambient Floating Particles in Background -->
  <circle class="p1" cx="120" cy="240" r="3" fill="#38bdf8"/>
  <circle class="p2" cx="340" cy="70" r="2.5" fill="#a855f7"/>
  <circle class="p3" cx="720" cy="290" r="4" fill="#f472b6"/>
  <circle class="p1" cx="1100" cy="90" r="3" fill="#818cf8"/>

  <!-- DYNAMIC BACKGROUND GRAPHICS (Positioned on the Right Side so Foreground Text Remains 100% Clear) -->
  <g class="float-element-1" transform="translate(780, 55)">
    <!-- Main Interactive Deal Hub Card Graphic -->
    <rect width="360" height="230" rx="14" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5" backdrop-filter="blur(10px)"/>
    
    <!-- Top Bar inside graphic card -->
    <rect width="360" height="40" rx="14" fill="#ffffff" fill-opacity="0.05"/>
    <circle cx="24" cy="20" r="5" fill="#ef4444" opacity="0.8"/>
    <circle cx="40" cy="20" r="5" fill="#eab308" opacity="0.8"/>
    <circle cx="56" cy="20" r="5" fill="#22c55e" opacity="0.8"/>
    <rect x="80" y="13" width="160" height="14" rx="7" fill="#ffffff" fill-opacity="0.1"/>
    <rect x="290" y="11" width="54" height="18" rx="9" fill="url(#primaryGrad)"/>
    <text x="317" y="24" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">LIVE DSR</text>

    <!-- Card Content Elements -->
    <!-- Buyer Enablement Progress Widget -->
    <rect x="20" y="55" width="200" height="75" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="32" y="75" class="card-title">Mutual Action Plan</text>
    <text x="32" y="92" class="card-sub">Enterprise License Deal Hub</text>
    <!-- Progress Bar -->
    <rect x="32" y="106" width="145" height="8" rx="4" fill="#ffffff" fill-opacity="0.1"/>
    <rect x="32" y="106" width="110" height="8" rx="4" fill="url(#primaryGrad)"/>
    <text x="186" y="114" font-family="sans-serif" font-size="10" font-weight="bold" fill="#38bdf8">75%</text>

    <!-- Engagement Analytics Pill -->
    <rect x="230" y="55" width="110" height="75" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="242" y="75" class="card-title">Buyer Activity</text>
    <path d="M 242 110 L 260 98 L 278 104 L 298 88 L 322 94" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="322" cy="94" r="3.5" fill="#22c55e" filter="url(#subtleGlow)"/>

    <!-- Document & E-Sign Widgets -->
    <rect x="20" y="142" width="155" height="68" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="32" y="154" width="24" height="24" rx="6" fill="#6366f1" fill-opacity="0.2"/>
    <path d="M 40 162 L 48 162 M 40 166 L 48 166 M 40 170 L 45 170" stroke="#818cf8" stroke-width="2" stroke-linecap="round"/>
    <text x="64" y="164" class="card-title">Proposal.pdf</text>
    <text x="64" y="178" class="card-sub">Documenso e-Sign ✓</text>

    <!-- Live Stakeholder Room Widget -->
    <rect x="185" y="142" width="155" height="68" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="205" cy="164" r="10" fill="#a855f7" fill-opacity="0.3"/>
    <text x="205" y="168" font-family="sans-serif" font-size="10" font-weight="bold" fill="#e0e7ff" text-anchor="middle">VP</text>
    <circle cx="222" cy="164" r="10" fill="#06b6d4" fill-opacity="0.3"/>
    <text x="222" y="168" font-family="sans-serif" font-size="10" font-weight="bold" fill="#e0e7ff" text-anchor="middle">AE</text>
    <text x="197" y="193" class="card-sub">5 Buyers Active Now</text>
    <circle cx="298" cy="190" r="4" fill="#22c55e" filter="url(#subtleGlow)"/>
  </g>

  <!-- Secondary Dynamic Floating Pill Graphic -->
  <g class="float-element-2" transform="translate(730, 215)">
    <rect width="165" height="42" rx="21" fill="#0f172a" fill-opacity="0.85" stroke="#a855f7" stroke-width="1.5" filter="url(#subtleGlow)"/>
    <circle cx="22" cy="21" r="7" fill="#22c55e"/>
    <text x="37" y="25" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Open &amp; Commercial</text>
  </g>

  <!-- FOREGROUND CONTENT: Title, Subtitle, Badges (Guaranteed Unobscured & Perfectly Crisp) -->
  <g transform="translate(60, 0)">
    
    <!-- Top Category Pill Badge -->
    <g transform="translate(0, 52)">
      <rect width="250" height="28" rx="14" fill="#6366f1" fill-opacity="0.15" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1"/>
      <text x="12" y="18" class="badge-text">🚀 REVENUE TECH ECOSYSTEM</text>
    </g>

    <!-- Main Title with Gradient Text Styling -->
    <text x="0" y="132" class="title">Awesome Digital Sales Room 💼</text>
    
    <!-- Decorative Gradient Accent Bar beneath Title -->
    <rect x="0" y="148" width="480" height="4" rx="2" fill="url(#primaryGrad)"/>

    <!-- Subtitle Line 1 -->
    <text x="0" y="186" class="subtitle">Curated Buyer Enablement Portals, Mutual Action Plans &amp; Deal Hubs</text>
    
    <!-- Subtitle Line 2 -->
    <text x="0" y="214" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="15" fill="#94a3b8">
      Empowering Revenue Teams &amp; Builders with SaaS Leaders &amp; Open-Source Stacks
    </text>

    <!-- Bottom Feature Tag Pills -->
    <g transform="translate(0, 246)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="140" height="30" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="14" y="19" font-family="sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">📊 SaaS Pricing &amp; ARR</text>

      <!-- Tag 2 -->
      <rect x="150" y="0" width="155" height="30" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="164" y="19" font-family="sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">⭐ Open-Source Stacks</text>

      <!-- Tag 3 -->
      <rect x="315" y="0" width="155" height="30" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="329" y="19" font-family="sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">🤝 Buyer Collaboration</text>
    </g>

  </g>
</svg>
